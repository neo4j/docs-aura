name: "Generate HTML"

# edit the list of branches according to your repository
# the list of branches should contain all the branches in your Antora publish playbooks
on:
  push:
    branches:
    - 'console'
  workflow_dispatch:

jobs:

  prepare-ref-env:
    name: Set build branch and environments
    runs-on: ubuntu-latest
    outputs:
      build-ref: ${{ steps.set-ref-env.outputs.build-ref }}
      environments: ${{ steps.set-ref-env.outputs.environments }}
    steps:
      # DOCS_DEV_BRANCH and DOCS_PROD_BRANCH are required repository variables
      # (Settings -> Secrets and variables -> Actions -> Variables), not
      # values to edit here. `docs-publish` independently reads the same
      # variables from this repo's settings to verify what it's asked to
      # publish, so they can't be set by editing this file on a branch/PR.
      # `dev` is the branch you use to build and publish to staging.
      # `main` is the branch you use to build and publish to neo4j.com/docs.
      # If your repo has no separate prod environment, set DOCS_PROD_BRANCH
      # equal to DOCS_DEV_BRANCH.
      - name: Set Build Ref
        id: set-ref-env
        env:
          DEV_BRANCH: ${{ vars.DOCS_DEV_BRANCH }}
          PROD_BRANCH: ${{ vars.DOCS_PROD_BRANCH }}
        run: |
          dev_branch="${DEV_BRANCH}"
          prod_branch="${PROD_BRANCH}"

          if [[ -z "${dev_branch}" ]]; then
            echo "::error::vars.DOCS_DEV_BRANCH is not set for this repository. Set it in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi
          if [[ -z "${prod_branch}" ]]; then
            echo "::error::vars.DOCS_PROD_BRANCH is not set for this repository. Set it in Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/${dev_branch}" ]]; then
            build_from="${dev_branch}"
            environments='["dev"]'
          else
            build_from="${prod_branch}"
            environments='["prod"]'
          fi

          if [[ "${dev_branch}" == "${prod_branch}" ]]; then
            environments='["dev","prod"]'
          fi

          echo "build-ref=${build_from}" >> $GITHUB_OUTPUT
          echo "environments=${environments}" >> $GITHUB_OUTPUT

  docs-build:
    name: Generate HTML
    needs: prepare-ref-env
    uses: neo4j/docs-tools/.github/workflows/reusable-docs-build.yml@v2
    with:
      package-script: 'verify:publish'
      build-ref: ${{needs.prepare-ref-env.outputs.build-ref}}
      fetch-depth: 0

  docs-verify:
    name: Verify HTML
    needs: docs-build
    uses: neo4j/docs-tools/.github/workflows/reusable-docs-verify.yml@v2
    with:
      failOnWarnings: true

  publish-html:
    name: Publish HTML
    needs: [docs-verify, prepare-ref-env]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environments: ${{ fromJson(needs.prepare-ref-env.outputs.environments) }}

    steps:
      - name: Publish to ${{ matrix.environments }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: neo4j/docs-publish
          event-type: publish-html
          client-payload: |-
            {
              "org": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "run_id": "${{ github.run_id }}",
              "publish_env": "${{ matrix.environments }}"
            }

      - name: Echo
        if: ${{ matrix.environments == 'prod' }}
        run: |
          echo "If this step runs then approval has been granted" >> $GITHUB_STEP_SUMMARY
